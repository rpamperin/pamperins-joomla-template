PLG_SYSTEM_PTSSO="System - Pamperins Single Sign-On"
PLG_SYSTEM_PTSSO_XML_DESCRIPTION="One login for the website and the Pamperins CRM (support.pamperins.com), using OpenID Connect. Adds a 'Log in with Pamperins' button to the site and admin login forms. The normal password login keeps working as a backup."
PLG_SYSTEM_PTSSO_ISSUER="Login server (issuer)"
PLG_SYSTEM_PTSSO_ISSUER_DESC="The CRM's address, e.g. https://support.pamperins.com. Its settings are read from /.well-known/openid-configuration."
PLG_SYSTEM_PTSSO_CLIENT_ID="Client ID"
PLG_SYSTEM_PTSSO_CLIENT_SECRET="Client secret"
PLG_SYSTEM_PTSSO_CLIENT_SECRET_DESC="From the CRM's client registration for the website. Type it here only — never send it by e-mail or chat."
PLG_SYSTEM_PTSSO_BUTTON_LABEL="Button text"
PLG_SYSTEM_PTSSO_ENABLE_SITE="Show on the customer login page"
PLG_SYSTEM_PTSSO_ENABLE_ADMIN="Show on the admin login page"
PLG_SYSTEM_PTSSO_FIELDSET_ACCOUNTS="Accounts and roles"
PLG_SYSTEM_PTSSO_AUTO_CREATE="Create website accounts automatically"
PLG_SYSTEM_PTSSO_LINK_EMAIL="Link existing accounts by e-mail"
PLG_SYSTEM_PTSSO_LINK_EMAIL_DESC="If someone already has a website account with the same e-mail, link it (only when the login server says the e-mail is verified)."
PLG_SYSTEM_PTSSO_ROLES_CLAIM="Roles claim name"
PLG_SYSTEM_PTSSO_ROLE_ADMIN="CRM role for admins"
PLG_SYSTEM_PTSSO_ROLE_ADMIN_DESC="People with this CRM role get the website group below (Administrator) and can use the website admin. Everyone else is a normal customer account."
PLG_SYSTEM_PTSSO_GROUP_ADMIN="Website group for admins"
PLG_SYSTEM_PTSSO_ROLE_MANAGER="CRM role for website managers"
PLG_SYSTEM_PTSSO_ROLE_MANAGER_DESC="Leave empty (the default) so no CRM staff can edit the website. Type <code>office</code> to let office staff edit site content. Don't use <code>staff</code>: that would include every technician. Accounts linked to the CRM get or lose this group each time they log in with Pamperins."
PLG_SYSTEM_PTSSO_GROUP_MANAGER="Website group for managers"
PLG_SYSTEM_PTSSO_GROUP_CLIENT="Website group for everyone else (customers)"
PLG_SYSTEM_PTSSO_GROUP_CLIENT_DESC="Every SSO user gets this group. Admin/staff groups are added or removed to match the CRM role at each login. Super Users is never changed."
PLG_SYSTEM_PTSSO_DISCOVERY="Discovery URL (override)"
PLG_SYSTEM_PTSSO_DISCOVERY_DESC="Leave empty. Only for testing when the server reaches the login server at a different address."
PLG_SYSTEM_PTSSO_ALLOW_HTTP="Allow plain http (testing only)"
PLG_SYSTEM_PTSSO_ALLOW_HTTP_DESC="Never turn this on for a real site."
PLG_SYSTEM_PTSSO_ERR_NOT_CONFIGURED="Single sign-on isn't set up yet. Please log in with your username and password."
PLG_SYSTEM_PTSSO_ERR_PROVIDER="The login server couldn't be reached. Please try again, or log in with your username and password."
PLG_SYSTEM_PTSSO_ERR_STATE="Your login session expired. Please try again."
PLG_SYSTEM_PTSSO_ERR_TOKEN="The login could not be confirmed. Please try again."
PLG_SYSTEM_PTSSO_ERR_NO_ACCOUNT="There's no website account for this login, and automatic accounts are switched off."
PLG_SYSTEM_PTSSO_ERR_NO_ADMIN="Your account doesn't have access to the website admin."
PLG_SYSTEM_PTSSO_ERR_BLOCKED="This account is blocked. Please contact Pamperins Tech."
PLG_SYSTEM_PTSSO_ERR_DENIED="Login was cancelled."
PLG_SYSTEM_PTSSO_WELCOME="Welcome, %s. You are logged in."
PLG_SYSTEM_PTSSO_ERR_EMAIL_IN_USE="You already have a website account with this e-mail. Log in with your website password once, then click <strong>Link my support account</strong>. After that, Log in with Pamperins will work."
PLG_SYSTEM_PTSSO_ERR_LINK_TAKEN="That Pamperins support account is already linked to a different website account."
PLG_SYSTEM_PTSSO_LINK_TITLE="Use one login for everything"
PLG_SYSTEM_PTSSO_LINK_TEXT="Link your Pamperins support account (the one you use for remote help) to this website account. Then you can use Log in with Pamperins here."
PLG_SYSTEM_PTSSO_LINK_BUTTON="Link my support account"
PLG_SYSTEM_PTSSO_LINK_DONE="Your support account is now linked. Next time, just click Log in with Pamperins."
PLG_SYSTEM_PTSSO_LINKED="Your website account is linked to your Pamperins support account."
